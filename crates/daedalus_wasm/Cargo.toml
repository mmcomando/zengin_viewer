[package]
name = "daedalus_wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = { workspace = true }
encoding_rs = { workspace = true }
wat = { workspace = true }
wasm-encoder = { workspace = true, features = ["wasmparser"] }
wasmparser = { workspace = true }
wit-component = { workspace = true }
wit-parser = { workspace = true }

[dev-dependencies]
wasmtime = { workspace = true, features = ["component-model", "coredump"] }
daedalus_typed = { path = "../daedalus_typed" }
