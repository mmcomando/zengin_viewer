[package]
name = "daedalus_wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
encoding_rs = "0.8"
wat = "1.253.0"
wasm-encoder = { "version" = "0.248.0", features = [ "wasmparser"] }
wasmparser = "0.248.0"
wit-component = "0.251.0"
wit-parser = "0.251.0"

[dev-dependencies]
wasmtime = { "version" = "44.0.0", features = ["component-model", "coredump"] }
