[package]
name = "zengin_viewer"
version = "0.2.0"
edition = "2024"


[dependencies]
# On bevy update most of those need an update
bevy = { workspace = true, features = ["dynamic_linking", "bevy_dev_tools", "render_dev_tools", "free_camera", "serialize"] }
leafwing-input-manager = { workspace = true }
avian3d = { workspace = true }
bevy_rich_text3d = { workspace = true }
bevy_egui = { workspace = true }
# Upstream is slow to update
bevy_mod_openxr = { workspace = true }
bevy_mod_xr = { workspace = true }
bevy_xr_utils = { workspace = true }

# ZenGin related
ZenKit-rs = { path = "../ZenKit-rs" }
dmusic-sys = { path = "../dmusic-sys" }
daedalus_wasm = { path = "../daedalus_wasm" }
daedalus_typed = { path = "../daedalus_typed" }
wasmtime = { workspace = true }

# Game related
pathfinding = "4.16.0"

# Internal developer utilities
dev_util = { path = "../dev_util" }

# VR
openxr = { workspace = true }

# File formats
serde = { workspace = true }
ron = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.22.2", features = ["symphonia-wav", "symphonia-adpcm"] }


# Generic dependencies
clap = { version = "4", features = ["derive"] }
byteorder = { workspace = true }
strum = { workspace = true, features = ["derive"] }
rand_mt = "6.1.0"
regex = "1.13"
bevy-inspector-egui = { workspace = true }
egui_dock = { workspace = true }

[features]
# Logs per-function timing and counters for movement systems through
# `perf_debug!`, and per-frame script function call counts. No-op when disabled.
debug_perf = ["dev_util/debug_perf"]
# Writes a `trace-<timestamp>.json` (chrome://tracing / Perfetto format) of the
# schedule and system spans, for CPU profiling. Beware: it is very large.
trace_chrome = ["bevy/trace_chrome"]
