[package]
name = "ZenGinViewer"
version = "0.1.0"
edition = "2024"


[dependencies]
clap = { version = "4", features = ["derive"] }
bevy = { version = "0.19.0", features = ["dynamic_linking", "bevy_dev_tools", "free_camera", "serialize"] }
avian3d = "0.7.0"
byteorder = "1.5"
ZenKit-rs = { path = "../ZenKit-rs" }
daedalus_wasm = { path = "../daedalus_wasm" }
ron = "0.12.0"
strum = { version = "0.28", features = ["derive"] }
serde = "1.0.228"
bevy_egui = "0.41.1"
leafwing-input-manager = "0.21.0"
openxr = "0.21.1"
bevy_mod_openxr = "0.6.0"
bevy_mod_xr = "0.6.0"
bevy_xr_utils = "0.6.0"
wasmtime = "46.0.1"
rodio = { version = "0.22.2", features = ["symphonia-wav", "symphonia-adpcm"] }
rand_mt = "6.1.0"
pathfinding = "4.16.0"
bevy_rich_text3d = "0.7"

[features]
# Writes a `trace-<timestamp>.json` (chrome://tracing / Perfetto format) of the
# schedule and system spans, for CPU profiling. Beware: it is very large.
trace_chrome = ["bevy/trace_chrome"]
