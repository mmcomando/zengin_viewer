[package]
name = "ZenGinViewer"
version = "0.1.0"
edition = "2024"


[dependencies]
# On bevy update most of those need an update
bevy = { version = "0.20.0", features = ["dynamic_linking", "bevy_dev_tools", "render_dev_tools", "free_camera", "serialize"] }
leafwing-input-manager = "0.22.0"
avian3d = "0.8.0"
bevy_rich_text3d = "0.8"
bevy_egui = "0.43.1"
# Upstream is slow to update
bevy_mod_openxr = { git = "https://github.com/MaximilianHausen/bevy_oxr.git", branch = "bevy_0.20" }
bevy_mod_xr = { git = "https://github.com/MaximilianHausen/bevy_oxr.git", branch = "bevy_0.20" }
bevy_xr_utils = { git = "https://github.com/MaximilianHausen/bevy_oxr.git", branch = "bevy_0.20" }

# ZenGin related
ZenKit-rs = { path = "../ZenKit-rs" }
daedalus_wasm = { path = "../daedalus_wasm" }
wasmtime = "46.0.1"

# Game related
pathfinding = "4.16.0"

# VR
openxr = "0.22.0"

# File formats
serde = "1.0.228"
ron = "0.12.0"
rodio = { version = "0.22.2", features = ["symphonia-wav", "symphonia-adpcm"] }


# Generic dependencies
clap = { version = "4", features = ["derive"] }
byteorder = "1.5"
strum = { version = "0.28", features = ["derive"] }
rand_mt = "6.1.0"

[features]
# Writes a `trace-<timestamp>.json` (chrome://tracing / Perfetto format) of the
# schedule and system spans, for CPU profiling. Beware: it is very large.
trace_chrome = ["bevy/trace_chrome"]
