[package]
name = "ZenGinViewer"
version = "0.1.0"
edition = "2024"


[dependencies]
bevy = { version = "0.19.0", features = ["dynamic_linking", "bevy_dev_tools", "free_camera"] }
avian3d = "0.7.0"
byteorder = "1.5"
ZenKit-rs = { git = "https://github.com/mmcomando/ZenKit-rs.git", rev = "3569091272cac1bc2fe149aa7439ab136bfc73b9" }
ron = "0.12.0"
serde = "1.0.228"
bevy_egui = "0.41.1"
openxr = "0.21.1"
bevy_mod_openxr = "0.6.0"
bevy_mod_xr = "0.6.0"
bevy_xr_utils = "0.6.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/mold"]
